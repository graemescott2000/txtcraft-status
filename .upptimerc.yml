# Owner and repository configuration
owner: graemescott2000
repo: txtcraft-status

# Status page branding
sites:
  - name: Core API & Database
    url: https://txtcraft.ca/api/health
    icon: https://txtcraft.ca/favicon.ico
    check: "status-code"
    expectedStatusCodes:
      - 200

  - name: TxtCraft Marketing & Web Builder
    url: https://txtcraft.ca/
    icon: https://txtcraft.ca/favicon.ico

  - name: Tenant Wildcard Routing (*.txtcraft.ca)
    url: https://solvedthings.txtcraft.ca/

  - name: Media CDN (DigitalOcean Spaces)
    url: https://txtcraft-media.tor1.digitaloceanspaces.com/tenants/tenant-solvedthings/media/1793462775916_bic.jpg
