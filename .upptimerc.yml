# Status Page Details
status-website:
  cname: status.txtcraft.ca
  name: TxtCraft Status
  introTitle: "TxtCraft Platform Status"
  introMessage: "Real-time performance and historical uptime monitoring for the TxtCraft website engine, wildcard routing, and asset delivery."
  navbar:
    - title: TxtCraft Home
      href: https://txtcraft.ca
    - title: Workspace Login
      href: https://txtcraft.ca/login

# Incident issue settings
assignees:
  - graemescott2000
